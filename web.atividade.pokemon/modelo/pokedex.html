<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5e5e5;
      color: #222;
    }

    .topo {
      background: #d62828;
      color: white;
      text-align: center;
      padding: 20px 0;
      font-size: 2rem;
      font-weight: bold;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 20px auto;
    }

    .filtro {
      background: #f2f2f2;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
      padding: 15px;
    }

    .linha {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #bdbdbd;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    select {
      min-width: 160px;
    }

    button {
      background: #2d6cdf;
      color: white;
      border: none;
      cursor: pointer;
      padding: 10px 18px;
    }

    .btn-limpar {
      margin-top: 15px;
      background: #e6e6e6;
      color: #333;
      border: 1px solid #c9c9c9;
    }

    .painel {
      background: #f5f5f5;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      margin-top: 20px;
      padding: 20px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pokemon-card {
      width: 100%;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pokemon-card img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .pokemon-card h2 {
      margin: 0 0 10px;
    }

    .pokemon-card p {
      margin: 6px 0;
    }

    .sem-resultado {
      margin-top: 20px;
      background: #f8e9b5;
      border: 1px solid #e0cc7d;
      color: #5b4d1a;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
      font-weight: bold;
    }

    .lista {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
    }

    .mini-card {
      background: white;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .mini-card img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
    }

    .mini-card h3 {
      margin: 5px 0;
      font-size: 1.1rem;
    }

    @media (max-width: 600px) {
      .linha {
        flex-direction: column;
        align-items: stretch;
      }

      input, select, button {
        width: 100%;
      }

      .pokemon-card {
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="topo">Pokédex</header>

  <main class="container">
    <section class="filtro">
      <div class="linha">
        <input id="campoNome" type="text" placeholder="Digite o nome do Pokémon">

        <select id="campoTipo">
          <option value="">Todos</option>
        </select>

        <button id="btnBuscar" type="button">Buscar</button>
      </div>

      <button id="btnLimpar" type="button" class="btn-limpar">Limpar filtros</button>
    </section>

    <section id="detalhes" class="painel"></section>

    <div id="mensagem" class="sem-resultado" style="display:none;">
      Nenhum Pokémon encontrado com esses filtros.
    </div>

    <section id="listaPokemon" class="lista"></section>
  </main>

  <script>
    const pokedex = [
      {
        nome: 'Eevee',
        tipo: 'Normal',
        geracao: 'I',
        descricao: 'Pokémon muito versátil, capaz de evoluir de formas diferentes.',
        imagem: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png'
      },
      {
        nome: 'Bulbassauro',
        tipo: 'Planta',
        geracao: 'I',
        descricao: 'Pokémon planta que usa folhas para capturar energia do sol.',
        imagem: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png'
      },
      {
        nome: 'Charmander',
        tipo: 'Fogo',
        geracao: 'I',
        descricao: 'Pokémon fogo com cauda em chamas e muito espírito.',
        imagem: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png'
      },
      {
        nome: 'Squirtle',
        tipo: 'Água',
        geracao: 'I',
        descricao: 'Pokémon água que usa sua concha para se proteger.',
        imagem: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png'
      },
      {
        nome: 'Pikachu',
        tipo: 'Elétrico',
        geracao: 'I',
        descricao: 'Pokémon elétrico muito famoso e cheio de energia.',
        imagem: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png'
      },
      {
        nome: 'Gengar',
        tipo: 'Fantasma',
        geracao: 'I',
        descricao: 'Pokémon sombrio que gosta de assustar e brincar.',
        imagem: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png'
      }
    ];

    const campoNome = document.getElementById('campoNome');
    const campoTipo = document.getElementById('campoTipo');
    const btnBuscar = document.getElementById('btnBuscar');
    const btnLimpar = document.getElementById('btnLimpar');
    const detalhes = document.getElementById('detalhes');
    const listaPokemon = document.getElementById('listaPokemon');
    const mensagem = document.getElementById('mensagem');

    function listarTipos() {
      const tipos = [...new Set(pokedex.map(p => p.tipo))].sort();

      tipos.forEach(tipo => {
        const option = document.createElement('option');
        option.value = tipo;
        option.textContent = tipo;
        campoTipo.appendChild(option);
      });
    }

    function filtrarPokemons() {
      const nome = campoNome.value.trim().toLowerCase();
      const tipo = campoTipo.value;

      return pokedex.filter(pokemon => {
        const nomeValido = !nome || pokemon.nome.toLowerCase().includes(nome);
        const tipoValido = !tipo || pokemon.tipo === tipo;
        return nomeValido && tipoValido;
      });
    }

    function renderDetalhes(listaFiltrada) {
      if (listaFiltrada.length === 0) {
        detalhes.innerHTML = '';
        mensagem.style.display = 'block';
        return;
      }

      const pokemon = listaFiltrada[0];
      detalhes.innerHTML = `
        <div class="pokemon-card">
          <img src="${pokemon.imagem}" alt="${pokemon.nome}">
          <div>
            <h2>${pokemon.nome}</h2>
            <p><strong>Tipo:</strong> ${pokemon.tipo}</p>
            <p><strong>Geração:</strong> ${pokemon.geracao}</p>
            <p>${pokemon.descricao}</p>
          </div>
        </div>
      `;
      mensagem.style.display = 'none';
    }

    function renderLista(listaFiltrada) {
      if (listaFiltrada.length === 0) {
        listaPokemon.innerHTML = '';
        return;
      }

      listaPokemon.innerHTML = listaFiltrada.map(pokemon => `
        <div class="mini-card">
          <img src="${pokemon.imagem}" alt="${pokemon.nome}">
          <h3>${pokemon.nome}</h3>
          <p>${pokemon.tipo}</p>
        </div>
      `).join('');
    }

    function renderizar() {
      const listaFiltrada = filtrarPokemons();
      renderDetalhes(listaFiltrada);
      renderLista(listaFiltrada);
    }

    btnBuscar.addEventListener('click', renderizar);

    btnLimpar.addEventListener('click', () => {
      campoNome.value = '';
      campoTipo.value = '';
      renderizar();
    });

    listarTipos();
    renderizar();
  </script>
</body>
</html>
